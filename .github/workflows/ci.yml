name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Catalog sync check (offline)
        run: python scripts/check_hub_sync.py
      - name: Pytest (functional, privacy, explainability, bias, orchestration, samples)
        run: pytest -q
      - name: Golden suites
        run: |
          agentest run --suite functional --agent golden
          agentest run --suite privacy --agent golden
          agentest run --suite explainability --agent golden
          agentest run --suite bias_fairness --agent golden
          agentest run --suite orchestration --agent golden
      - name: Sample agent matrix
        run: |
          agentest samples
          agentest matrix
      - name: Real checks - 41 IDs x 27 agents (offline replay of recorded reference-agent episodes)
        run: |
          agentest real --md real-results.md --json real-results.json
          cat real-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: real-results
          path: real-results.*
