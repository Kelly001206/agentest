name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest (functional, privacy, explainability, bias, samples)
        run: pytest -q
      - name: Golden suites
        run: |
          agentest run --suite functional --agent golden
          agentest run --suite privacy --agent golden
          agentest run --suite explainability --agent golden
          agentest run --suite bias_fairness --agent golden
      - name: Sample agent matrix
        run: |
          agentest samples
          agentest matrix
